startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      ibancheckerApiKey:
        type: string
        title: IBANChecker API Key
        description: "API key from ibanchecker.cash/api-docs, needed for the validation and extraction tools (the free key covers 100 requests a month)."
    required: []
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@ibanchecker/mcp'],
      env: config.ibancheckerApiKey
        ? { IBANCHECKER_API_KEY: config.ibancheckerApiKey }
        : {}
    })
